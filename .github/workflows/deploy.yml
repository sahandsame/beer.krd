name: Deploy

# Builds the three images, pushes them to GitHub Container Registry, then updates the VPS.
# Repository secrets needed: VPS_HOST, VPS_USER, VPS_SSH_KEY (and optionally VPS_PORT).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: web, app: web, target: app }
          - { name: admin, app: admin, target: app }
          - { name: tools, app: web, target: tools }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/beer-krd" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: APP=${{ matrix.app }}
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}-${{ matrix.name }}:latest
            ${{ steps.prefix.outputs.value }}-${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: /opt/beer-krd/docker/deploy.sh
