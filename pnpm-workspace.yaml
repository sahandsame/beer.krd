packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"

autoInstallPeers: true

allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  sharp: true
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  unrs-resolver: true
  # Linux-only optional deps that ship prebuilt binaries; their install scripts aren't needed.
  "@parcel/watcher": false
  "@swc/core": false
